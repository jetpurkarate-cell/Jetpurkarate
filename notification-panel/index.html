<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jetpur Karate Team - Notification Panel</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 16px;background:#f5f5f5}
.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
input,textarea,button{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px}
button{cursor:pointer;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
h1{margin-top:0}@media(max-width:650px){.row{grid-template-columns:1fr}}
#status{font-weight:700}
</style>
</head>
<body>
<h1>Jetpur Karate Team</h1>

<div class="card">
<h2>Send Notification Now</h2>
<input id="nowTitle" placeholder="Notification title">
<textarea id="nowBody" placeholder="Notification message"></textarea>
<input id="nowLink" placeholder="Optional website link">
<button onclick="sendNow()">Send Now</button>
</div>

<div class="card">
<h2>Schedule Notification</h2>
<input id="sTitle" placeholder="Title">
<textarea id="sBody" placeholder="Message"></textarea>
<div class="row">
<input id="sDate" type="date">
<input id="sTime" type="time" value="09:00">
</div>
<input id="sLink" placeholder="Optional website link">
<button onclick="schedule()">Schedule Notification</button>
</div>

<div class="card">
<h2>Birthday Notification</h2>
<input id="bName" placeholder="Student / Teacher / Member name">
<div class="row">
<input id="bDate" type="date">
<input id="bBranch" placeholder="Branch (optional)">
</div>
<input id="bTime" type="time" value="09:00">
<button onclick="addBirthday()">Save Birthday</button>
</div>

<div id="status" class="card">Configure Supabase URL and publishable key in this file before use.</div>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_SUPABASE_PUBLISHABLE_KEY";

async function api(path,options={}) {
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{
    ...options,
    headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",...(options.headers||{})}
  });
  if(!r.ok) throw new Error(await r.text());
  return r;
}
async function sendNow(){
  try{
    const r=await fetch(SUPABASE_URL+"/functions/v1/send-now",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify({title:nowTitle.value,body:nowBody.value,link:nowLink.value})});
    if(!r.ok) throw new Error(await r.text());
    status.textContent="Notification sent.";
  }catch(e){status.textContent="Error: "+e.message}
}
async function schedule(){
  try{
    await api("notification_schedules",{method:"POST",body:JSON.stringify({title:sTitle.value,body:sBody.value,link:sLink.value||null,scheduled_at:new Date(sDate.value+"T"+sTime.value).toISOString()})});
    status.textContent="Notification scheduled.";
  }catch(e){status.textContent="Error: "+e.message}
}
async function addBirthday(){
  try{
    await api("birthdays",{method:"POST",body:JSON.stringify({person_name:bName.value,birth_date:bDate.value,branch_name:bBranch.value||null,notification_time:bTime.value})});
    status.textContent="Birthday saved.";
  }catch(e){status.textContent="Error: "+e.message}
}
</script>
</body>
</html>
