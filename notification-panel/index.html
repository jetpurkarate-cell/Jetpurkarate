<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jetpur Karate Team - Notification Panel</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 16px;background:#f5f5f5}
.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
input,textarea,button{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px}
button{cursor:pointer;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
h1{margin-top:0}@media(max-width:650px){.row{grid-template-columns:1fr}}
#status{font-weight:700}
</style>
</head>
<body>
<div id="loginCard" class="card">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>
<div id="app" style="display:none">
<div class="card"><button onclick="logout()">Logout</button></div>
<h1>Jetpur Karate Team</h1>

<div class="card">
<h2>Send Notification Now</h2>
<input id="nowTitle" placeholder="Notification title">
<textarea id="nowBody" placeholder="Notification message"></textarea>
<input id="nowLink" placeholder="Optional website link">
<button onclick="sendNow()">Send Now</button>
</div>

<div class="card">
<h2>Schedule Notification</h2>
<input id="sTitle" placeholder="Title">
<textarea id="sBody" placeholder="Message"></textarea>
<div class="row">
<input id="sDate" type="date">
<input id="sTime" type="time" value="09:00">
</div>
<input id="sLink" placeholder="Optional website link">
<button onclick="schedule()">Schedule Notification</button>
</div>

<div class="card">
<h2>Birthday Notification</h2>
<input id="bName" placeholder="Student / Teacher / Member name">
<div class="row">
<input id="bDate" type="date">
<input id="bBranch" placeholder="Branch (optional)">
</div>
<input id="bTime" type="time" value="09:00">
<button onclick="addBirthday()">Save Birthday</button>
</div>

<div id="status" class="card"></div></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL="https://avwpohoxcxbeezpuxbpr.supabase.co";
const SUPABASE_KEY="sb_publishable_WLd8v0cTTUFFZany_sAfmg_FmIyei2f";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
async function session(){
  const {data}=await supabase.auth.getSession();
  return data.session;
}
async function api(path,options={}){
  const s=await session();
  if(!s) throw new Error("Please login first.");
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{
    ...options,
    headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+s.access_token,"Content-Type":"application/json",...(options.headers||{})}
  });
  if(!r.ok) throw new Error(await r.text());
  return r;
}
window.login=async()=>{
  const {error}=await supabase.auth.signInWithPassword({email:$("email").value,password:$("password").value});
  if(error) $("status").textContent="Login error: "+error.message; else render();
};
window.logout=async()=>{await supabase.auth.signOut();render();};
window.sendNow=async()=>{
  try{
    const s=await session(); if(!s) throw new Error("Please login first.");
    const r=await fetch(SUPABASE_URL+"/functions/v1/send-now",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+s.access_token},body:JSON.stringify({title:$("nowTitle").value,body:$("nowBody").value,link:$("nowLink").value})});
    if(!r.ok) throw new Error(await r.text()); $("status").textContent="Notification sent.";
  }catch(e){$("status").textContent="Error: "+e.message}
};
window.schedule=async()=>{
  try{
    await api("notification_schedules",{method:"POST",body:JSON.stringify({title:$("sTitle").value,body:$("sBody").value,link:$("sLink").value||null,scheduled_at:new Date($("sDate").value+"T"+$("sTime").value).toISOString()})});
    $("status").textContent="Notification scheduled.";
  }catch(e){$("status").textContent="Error: "+e.message}
};
window.addBirthday=async()=>{
  try{
    await api("birthdays",{method:"POST",body:JSON.stringify({person_name:$("bName").value,birth_date:$("bDate").value,branch_name:$("bBranch").value||null,notification_time:$("bTime").value})});
    $("status").textContent="Birthday saved.";
  }catch(e){$("status").textContent="Error: "+e.message}
};
function render(){
  supabase.auth.getSession().then(({data})=>{
    $("loginCard").style.display=data.session?"none":"block";
    $("app").style.display=data.session?"block":"none";
    $("status").textContent=data.session?"Logged in: "+(data.session.user.email||"admin"):"Please login.";
  });
}
supabase.auth.onAuthStateChange(()=>render());
render();
</script>
</body>
</html>
