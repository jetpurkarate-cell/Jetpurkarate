name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore original user logo
        run: |
          base64 -d app/src/main/res/drawable/app_logo.png.b64 > app/src/main/res/drawable/app_logo.png
          rm app/src/main/res/drawable/app_logo.png.b64

      - name: Build Debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jetpur-Karate-Team-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error